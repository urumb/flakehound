name: flakehound
description: Find flaky pytest tests and prove why they're flaky. Free, local, private.
author: urumb
branding:
  icon: search
  color: orange

inputs:
  args:
    description: >
      Extra arguments for `flakehound run`, e.g. "-n 20 --fail-on flaky,time-bomb".
      Split on spaces (no shell evaluation).
    required: false
    default: ""
  working-directory:
    description: Directory of the project to hunt in (where you normally run pytest).
    required: false
    default: "."
  report:
    description: Path (relative to working-directory) for the JSON report.
    required: false
    default: flakehound-report.json

outputs:
  exit-code:
    description: "flakehound's exit code: 0 no problems, 1 problems found, 2 usage error."
    value: ${{ steps.hunt.outputs.exit-code }}
  report:
    description: Path of the JSON report (relative to working-directory).
    value: ${{ steps.hunt.outputs.report }}

runs:
  using: composite
  steps:
    # Installs flakehound from this action's own source, so pinning the action
    # to a commit SHA also pins exactly which flakehound code runs.
    - name: Install flakehound
      shell: bash
      env:
        FH_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$FH_ACTION_PATH"

    # Inputs are passed through environment variables, never interpolated into
    # the script, so they can't inject shell code. The Markdown report is added
    # to the job summary automatically.
    - name: Hunt flaky tests
      id: hunt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FH_ARGS: ${{ inputs.args }}
        FH_REPORT: ${{ inputs.report }}
      run: |
        read -r -a extra <<< "$FH_ARGS"
        echo "report=$FH_REPORT" >> "$GITHUB_OUTPUT"
        set +e
        python -m flakehound run --json "$FH_REPORT" "${extra[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
