# OpenSSF Scorecard: an independent, automated check of this repository's security
# practices (pinned actions, token permissions, branch protection, ...). Free; results
# show in the Security tab and on the public badge in the README.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2" # weekly, Tuesday 05:23 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to the Security tab
      id-token: write # lets the Scorecard service verify that results came from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
