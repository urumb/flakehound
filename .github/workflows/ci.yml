name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dev dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dev dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tests
        run: python -m pytest
      - name: Demo smoke test (must find the flaky tests)
        shell: bash
        working-directory: demo
        run: |
          set +e
          flakehound run -n 12 --seed 7 --json report.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit code 1 (flaky found), got $code"; exit 1; }
          python -c "import json; d = json.load(open('report.json')); assert d['summary']['flaky'] >= 3, d['summary']"
